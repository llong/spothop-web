<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr><td style="background:#05668d;padding:24px 32px;">
          <img src="{{ .SiteURL }}/spothopIcon.png" alt="" width="32" height="32" style="vertical-align:middle;border-radius:8px;">
          <span style="vertical-align:middle;margin-left:10px;color:#ffffff;font-size:20px;font-weight:800;">SpotHop</span>
        </td></tr>
        <tr><td style="padding:32px;color:#1a2530;">
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Your SpotHop sign-in link</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#44525f;">Tap the button below to sign in to SpotHop. The link works once and expires soon.</p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#05668d;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px;">Sign in</a>
          <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#7a8794;">If you didn't try to sign in, you can ignore this email.</p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#9aa5b1;">SpotHop &middot; Find and share skate spots</p>
    </td></tr>
  </table>
</body>
</html>
