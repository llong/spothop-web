name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      # 0 errors required; the warning count is capped so `any` debt can only go down.
      - name: Lint
        run: pnpm run lint:ci

      # Fails if coverage drops below the thresholds in vite.config.ts.
      - name: Test with coverage
        run: pnpm run coverage
